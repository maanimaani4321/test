name: Windows x64 DLL & Toolchain Builder

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-webrtc-cmake:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 2. Setup MSVC Developer Environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 3. Configure CMake (Exact Project Settings)
        shell: pwsh
        run: |
          $INSTALL_TOOLCHAIN = "${{ runner.workspace }}/install-toolchain" -replace '\\', '/'
          $INSTALL_TT = "${{ runner.workspace }}/install-teamtalk" -replace '\\', '/'

          # اجرای دقیق CMake پروژه
          cmake -S . -B output -A x64 `
            -DFEATURE_WEBRTC=ON `
            -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=ON `
            "-DTOOLCHAIN_INSTALL_PREFIX=$INSTALL_TOOLCHAIN" `
            "-DCMAKE_INSTALL_PREFIX=$INSTALL_TT"

      - name: 4. Build webrtc-src Target via CMake/MSBuild
        shell: cmd
        run: |
          cmake --build output --config Release --target webrtc-src -- /v:normal /fl "/flp:logfile=msbuild-webrtc.log;verbosity=detailed"

      - name: 5. Extract Exact Internal Error Log on Failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "====================================================" -ForegroundColor Red
          Write-Host "         INTERNAL CMAKE STEP FAILURE LOGS           " -ForegroundColor Red
          Write-Host "====================================================" -ForegroundColor Red

          # چاپ تمام لاگ‌های داخلی مراحل webrtc (دانلود، پچ، کانفیگ، بیلد)
          $stampLogs = Get-ChildItem -Path "output" -Recurse -Filter "webrtc-src-*.log" -ErrorAction SilentlyContinue
          foreach ($log in $stampLogs) {
              Write-Host "`n>>> LOG FILE: $($log.FullName)" -ForegroundColor Yellow
              Get-Content $log.FullName | Select-Object -Last 100
          }

          $stampErrs = Get-ChildItem -Path "output" -Recurse -Filter "webrtc-src-*.err" -ErrorAction SilentlyContinue
          foreach ($err in $stampErrs) {
              if ($err.Length -gt 0) {
                  Write-Host "`n>>> ERROR FILE: $($err.FullName)" -ForegroundColor Red
                  Get-Content $err.FullName
              }
          }