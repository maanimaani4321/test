name: Test Build FFmpeg Only (Windows x64)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-ffmpeg:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup MSVC Developer Environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: base-devel pkg-config
          release: false

      - name: Install NASM
        working-directory: ${{ runner.workspace }}
        shell: cmd
        run: |
          curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip
          7z x nasm.zip
          echo %CD%\nasm-3.01>> %GITHUB_PATH%

      - name: Clone and Setup FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg_build
          cd ffmpeg_build
          git clone --depth 1 --branch n8.1.1 https://github.com/FFmpeg/FFmpeg.git src

      - name: Prepare Fake pkg-config Script
        shell: pwsh
        run: |
          # تبدیل مسیر ویندوزی به مسیر استاندارد با اسلش رو به جلو برای MSYS2
          $WS_DIR = ($env:GITHUB_WORKSPACE -replace '\\', '/')
          $INC_DIR = "$WS_DIR/Library/TeamTalkLib/third_party/include"
          $LIB_DIR = "$WS_DIR/Library/TeamTalkLib/third_party/lib/x64"

          $PKG_DIR = New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/pkgconfig"

          $pkgScript = @"
          #!/bin/sh
          is_custom=0
          for arg in "`$@"; do
              case "`$arg" in
                  *rubberband*|*mysofa*)
                      is_custom=1
                      ;;
              esac
          done

          if [ "`$is_custom" -eq 1 ]; then
              for arg in "`$@"; do
                  case "`$arg" in
                      --exists)
                          exit 0
                          ;;
                      --modversion)
                          echo "2.0.2"
                          exit 0
                          ;;
                      --libs)
                          echo "-L$LIB_DIR -lrubberband -lmysofa -lfftw3f"
                          exit 0
                          ;;
                      --cflags)
                          echo "-I$INC_DIR"
                          exit 0
                          ;;
                  esac
              done
              exit 0
          fi

          exec pkg-config "`$@"
          "@

          $pkgScript | Set-Content -Path "$PKG_DIR/pkg-config" -NoNewline
          
          # اضافه کردن مجوز اجرا در محیط MSYS2
          bash -c "chmod +x /c/$((($PKG_DIR.FullName -replace 'C:\\','c/') -replace '\\','/'))/pkg-config"

      - name: Configure and Build FFmpeg
        shell: msys2 {0}
        run: |
          cd ffmpeg_build/src
          
          WS_UNIX="/c/$((("${{ github.workspace }}" -replace "C:\\\\","") -replace "\\\\","/"))"
          INC_DIR="$WS_UNIX/Library/TeamTalkLib/third_party/include"
          LIB_DIR="$WS_UNIX/Library/TeamTalkLib/third_party/lib/x64"
          PKG_PATH="$WS_UNIX/pkgconfig/pkg-config"
          INSTALL_DIR="$WS_UNIX/ffmpeg_install"

          echo "Configuring FFmpeg with MSVC..."
          ./configure \
            --prefix="$INSTALL_DIR" \
            --toolchain=msvc \
            --arch=x86_64 \
            --target-os=win64 \
            --disable-doc \
            --disable-programs \
            --disable-autodetect \
            --disable-debug \
            --enable-gpl \
            --enable-nonfree \
            --enable-librubberband \
            --enable-libmysofa \
            --pkg-config="$PKG_PATH" \
            --extra-cflags="-I$INC_DIR" \
            --extra-ldflags="-LIBPATH:$LIB_DIR rubberband.lib mysofa.lib fftw3f.lib"

          echo "Compiling FFmpeg..."
          make -j4
          make install

      - name: Print config.log on Failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "ffmpeg_build/src/ffbuild/config.log") {
              Write-Host "==================== FFmpeg config.log ===================="
              Get-Content "ffmpeg_build/src/ffbuild/config.log" -Tail 200
          } else {
              Write-Host "config.log file not found."
          }

      - name: Upload FFmpeg Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x64-binaries
          path: ffmpeg_install/