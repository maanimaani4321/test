name: Windows x64 DLL & Toolchain Builder

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-webrtc:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup MSVC Developer Environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 3. Setup depot_tools
        shell: cmd
        run: |
          mkdir C:\webrtc
          cd /d C:\webrtc
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo C:\webrtc\depot_tools>> %GITHUB_PATH%

      - name: 4. Fetch & Sync WebRTC (branch-heads/7778)
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          set PATH=C:\webrtc\depot_tools;%PATH%
          cd /d C:\webrtc

          echo === [1/5] Running fetch webrtc ===
          call fetch --nohooks webrtc
          if errorlevel 1 exit /b 1

          cd C:\webrtc\src

          echo === [2/5] Configuring branch-heads refspec ===
          call git config --add remote.origin.fetch "+refs/branch-heads/*:refs/remotes/origin/*"
          if errorlevel 1 exit /b 1

          echo === [3/5] Fetching origin ===
          call git fetch origin
          if errorlevel 1 exit /b 1

          echo === [4/5] Checking out branch-heads/7778 ===
          call git checkout branch-heads/7778
          if errorlevel 1 exit /b 1

          cd /d C:\webrtc
          echo === [5/5] Running gclient sync ===
          call gclient sync --with_branch_heads -D -j4
          if errorlevel 1 exit /b 1

      - name: 5. Apply TeamTalk Patch
        shell: cmd
        run: |
          cd /d C:\webrtc\src
          call git apply "%GITHUB_WORKSPACE%\Library\TeamTalkLib\build\webrtc\0001-Add-teamtalk-static-lib.patch"
          if errorlevel 1 (
              echo Patch failed from relative path, trying fallback...
              call git apply "%GITHUB_WORKSPACE%\webrtc\0001-Add-teamtalk-static-lib.patch"
          )

      - name: 6. Compile WebRTC (teamtalk.lib) with GN & Ninja
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          set PATH=C:\webrtc\depot_tools;%PATH%
          cd /d C:\webrtc\src

          mkdir out\Release
          
          :: تولید فایل کانفیگ args.gn
          (
            echo is_debug=false
            echo target_cpu="x64"
            echo rtc_disable_logging=true
            echo rtc_enable_protobuf=false
            echo rtc_include_tests=false
            echo use_custom_libcxx=false
            echo use_lld=false
          ) > out\Release\args.gn

          echo === Generating Ninja project ===
          call gn gen out\Release
          if errorlevel 1 exit /b 1

          echo === Building teamtalk.lib ===
          call ninja -C out\Release teamtalk
          if errorlevel 1 exit /b 1

      - name: 7. Verify Output Library
        shell: pwsh
        run: |
          Write-Host "Searching for compiled teamtalk.lib..." -ForegroundColor Green
          $libs = Get-ChildItem -Path "C:\webrtc\src\out\Release" -Filter "*.lib" -Recurse
          $libs | Format-Table FullName, Length -AutoSize