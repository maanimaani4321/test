name: Windows x64 DLL & Toolchain Builder

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test-webrtc:
    runs-on: windows-latest

    steps:
      - name: 1. Free Up Disk Space
        shell: pwsh
        run: |
          Write-Host "Freeing disk space for WebRTC..." -ForegroundColor Yellow
          $targets = @(
              "$env:ANDROID_HOME",
              "$env:ANDROID_NDK_HOME",
              "C:\Program Files\Android",
              "C:\Program Files\Java",
              "C:\hostedtoolcache\windows\Java",
              "C:\ProgramData\DockerDesktop"
          )
          foreach ($p in $targets) {
              if (Test-Path $p) { Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: 2. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 3. Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 4. Configure CMake (WebRTC ONLY)
        shell: pwsh
        run: |
          $INSTALL_TOOLCHAIN = "${{ runner.workspace }}/install-toolchain" -replace '\\', '/'
          $INSTALL_TT = "${{ runner.workspace }}/install-teamtalk" -replace '\\', '/'

          # تمام ابزارهای سنگین خاموش شده‌اند تا فقط WebRTC تست شود
          cmake -S . -B output -A x64 `
            -DFEATURE_WEBRTC=ON `
            -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=ON `
            -DTOOLCHAIN_OPENSSL=OFF `
            -DTOOLCHAIN_ACE=OFF `
            -DTOOLCHAIN_FFMPEG=OFF `
            -DTOOLCHAIN_LIBVPX=OFF `
            -DTOOLCHAIN_OPUS=OFF `
            -DTOOLCHAIN_SPEEX=OFF `
            -DTOOLCHAIN_SPEEXDSP=OFF `
            -DTOOLCHAIN_PORTAUDIO=OFF `
            -DTOOLCHAIN_MINIUPNPC=OFF `
            -DTOOLCHAIN_TINYXML2=OFF `
            -DTOOLCHAIN_OGG=OFF `
            -DTOOLCHAIN_ZLIB=OFF `
            -DTOOLCHAIN_CATCH2=OFF `
            "-DTOOLCHAIN_INSTALL_PREFIX=$INSTALL_TOOLCHAIN" `
            "-DCMAKE_INSTALL_PREFIX=$INSTALL_TT"

      - name: 5. Build WebRTC Target Directly
        shell: cmd
        run: |
          cmake --build output --config Release --target webrtc-src -- /v:minimal /fl "/flp:logfile=msbuild-webrtc.log;verbosity=normal"

      - name: 6. Check Error Log if Failed
        if: failure()
        shell: pwsh
        run: |
          Write-Host "================ BUILD FAILED ================" -ForegroundColor Red
          if (Test-Path "output/msbuild-webrtc.log") {
              Select-String -Path "output/msbuild-webrtc.log" -Pattern "error", "fatal error", "FAILED" | Select-Object -Last 30 | ForEach-Object { Write-Host $_.Line }
          }