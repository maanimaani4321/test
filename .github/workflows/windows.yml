name: Windows x64 DLL & Toolchain Builder

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Verify Third Party Files Existence
        shell: pwsh
        run: |
          Write-Host "====================================================" -ForegroundColor Cyan
          Write-Host "         CHECKING THIRD_PARTY DIRECTORY             " -ForegroundColor Cyan
          Write-Host "====================================================" -ForegroundColor Cyan
          
          $THIRDPARTY_PATH = "Library/TeamTalkLib/third_party"
          if (-not (Test-Path $THIRDPARTY_PATH)) {
              Write-Host "ERROR: Directory $THIRDPARTY_PATH does not exist in repository!" -ForegroundColor Red
              exit 1
          }

          Get-ChildItem -Path $THIRDPARTY_PATH -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

          $REQUIRED_FILES = @(
              "$THIRDPARTY_PATH/lib/x64/rubberband.lib",
              "$THIRDPARTY_PATH/lib/x64/mysofa.lib",
              "$THIRDPARTY_PATH/lib/x64/fftw3f.lib",
              "$THIRDPARTY_PATH/include/rubberband/rubberband-c.h",
              "$THIRDPARTY_PATH/include/mysofa.h",
              "$THIRDPARTY_PATH/include/fftw3.h"
          )

          $MISSING = 0
          foreach ($file in $REQUIRED_FILES) {
              if (-not (Test-Path $file)) {
                  Write-Host "MISSING FILE: $file (Check if git ignored it!)" -ForegroundColor Red
                  $MISSING++
              } else {
                  Write-Host "FOUND: $file" -ForegroundColor Green
              }
          }

          if ($MISSING -gt 0) {
              Write-Host "`nERROR: Some third_party files are missing from git! Use 'git add -f' to force add them." -ForegroundColor Red
              exit 1
          }

      - name: Setup MSVC Developer Environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: base-devel pkg-config
          release: false

      - name: Install NASM
        working-directory: ${{ runner.workspace }}
        shell: cmd
        run: |
          curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip
          7z x nasm.zip
          echo %CD%\nasm-3.01>> %GITHUB_PATH%

      - name: Configure CMake
        shell: pwsh
        run: |
          $INSTALL_TOOLCHAIN = "${{ runner.workspace }}/install-toolchain" -replace '\\', '/'
          $INSTALL_TT = "${{ runner.workspace }}/install-teamtalk" -replace '\\', '/'

          cmake -S . -B output -A x64 `
            -DFEATURE_WEBRTC=OFF `
            -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=ON `
            "-DTOOLCHAIN_INSTALL_PREFIX=$INSTALL_TOOLCHAIN" `
            "-DCMAKE_INSTALL_PREFIX=$INSTALL_TT"

      # =====================================================================
      # گام کلیدی: اول فقط FFmpeg را تست و بیلد می‌کنیم (زیر ۲ دقیقه)
      # =====================================================================
      - name: Fast Build FFmpeg Only (Test Step)
        shell: cmd
        run: |
          cmake --build output --config Release --target ffmpeg-src -- /v:minimal /fl "/flp:logfile=ffmpeg_build.log;verbosity=normal"

      # در صورت خطای FFmpeg، بلافاصله لاگ داخلی آن را چاپ می‌کند
      - name: Show FFmpeg config.log on Failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "====================================================" -ForegroundColor Red
          Write-Host "          FFMPEG CONFIG.LOG OUTPUT (LAST 120 LINES) " -ForegroundColor Red
          Write-Host "====================================================" -ForegroundColor Red

          $CONFIG_LOGS = Get-ChildItem -Path "output" -Filter "config.log" -Recurse
          foreach ($log in $CONFIG_LOGS) {
              Write-Host "`nLog File: $($log.FullName)" -ForegroundColor Yellow
              Get-Content $log.FullName -Tail 120
          }

          if (Test-Path "output/ffmpeg_build.log") {
              Write-Host "`nMSBuild Log Errors:" -ForegroundColor Yellow
              Select-String -Path "output/ffmpeg_build.log" -Pattern "error", "FAILED" | Select-Object -Last 30 | ForEach-Object { Write-Host $_.Line }
          }

      # اگر FFmpeg با موفقیت بیلد شد، حالا کل DLL ساخته می‌شود
      - name: Build Full TeamTalk5 Core and DLL
        shell: cmd
        run: |
          cmake --build output --config Release --target TeamTalk5DLL -- /v:minimal

      - name: Collect and Package Artifacts
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path final_package/bin
          New-Item -ItemType Directory -Force -Path final_package/include

          Copy-Item "${{ github.workspace }}/Library/TeamTalk_DLL/TeamTalk5.dll" -Destination final_package/bin/ -Force
          Copy-Item "${{ github.workspace }}/Library/TeamTalk_DLL/TeamTalk5.lib" -Destination final_package/bin/ -Force
          Copy-Item "${{ github.workspace }}/Library/TeamTalk_DLL/TeamTalk.h" -Destination final_package/include/ -Force

          Compress-Archive -Path final_package/* -DestinationPath TeamTalk5-Windows-x64.zip -Force

          if (Test-Path "${{ runner.workspace }}/install-toolchain") {
              Compress-Archive -Path "${{ runner.workspace }}/install-toolchain/*" -DestinationPath toolchain-windows-x64-install.zip -Force
          }

      - name: Upload Artifacts to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-win64
          name: "TeamTalk5 Windows x64 DLL & Prebuilt Dependencies"
          body: |
            Automated build for Windows x64 (MSVC /MT):
            - `TeamTalk5-Windows-x64.zip`: Contains `TeamTalk5.dll`, `TeamTalk5.lib`, and `TeamTalk.h`.
            - `toolchain-windows-x64-install.zip`: Full compiled dependency tree.
            
            Last updated: ${{ github.event.head_commit.timestamp || 'Manual Run' }}
          draft: false
          prerelease: true
          files: |
            TeamTalk5-Windows-x64.zip
            toolchain-windows-x64-install.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}